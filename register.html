<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>VozaPay || Create Your Account</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: linear-gradient(180deg, #0f0524 0%, #2b0a4d 100%);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px; background: rgba(15, 5, 36, 0.9);
            backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
        .logo img { width: 35px; height: 35px; }
        .logo span { font-size: 20px; font-weight: bold; letter-spacing: 0.5px; }

        /* Register Card Layout */
        .register-container {
            display: flex; justify-content: center; align-items: center;
            padding: 50px 20px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 30px;
            width: 100%;
            max-width: 480px;
            padding: 45px 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .register-header { text-align: center; margin-bottom: 35px; }
        .register-header h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
        .register-header p { font-size: 14px; color: #a1a1aa; }

        .price-tag {
            background: rgba(139, 92, 246, 0.15);
            color: #b49eff;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        /* The "Sharp" Inputs */
        .form-group { margin-bottom: 22px; position: relative; }
        
        label {
            display: block; font-size: 13px; font-weight: 600;
            margin-bottom: 10px; color: #c4b5fd; margin-left: 5px;
        }

        .input-wrapper { position: relative; }

        .input-wrapper i {
            position: absolute; left: 18px; top: 50%;
            transform: translateY(-50%); color: #8b5cf6;
            font-size: 15px; transition: 0.3s;
        }

        input, select {
            width: 100%;
            background: rgba(15, 5, 36, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px 15px 15px 48px;
            border-radius: 15px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.03);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }

        input:focus + i { color: #fff; }

        /* Submit Button */
        .btn-register {
            width: 100%;
            background: linear-gradient(90deg, #5e4ae3, #8b5cf6);
            color: white; border: none;
            padding: 18px; border-radius: 15px;
            font-size: 16px; font-weight: 700;
            cursor: pointer; transition: 0.4s;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(94, 74, 227, 0.2);
        }

        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(94, 74, 227, 0.4);
            filter: brightness(1.1);
        }

        .footer-note {
            text-align: center; margin-top: 30px;
            font-size: 13px; color: #71717a;
        }
        .footer-note a { color: #8b5cf6; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="VozaPay">
            <span>VozaPay</span>
        </a>
        <a href="#" style="color: #8b5cf6; text-decoration: none; font-size: 14px; font-weight: 600;">Login</a>
    </nav>

    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <span class="price-tag">LIFETIME ACCESS</span>
                <h1>Get Started</h1>
                <p>Africa's #1 Reward & Earning System</p>
            </div>

            <form id="registrationForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user-tie"></i>
                        <input type="text" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-at"></i>
                        <input type="text" id="usernameInput" placeholder="johndoe24" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" placeholder="john@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" placeholder="0810 000 0000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Select Country</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-earth-africa"></i>
                        <select required>
                            <option value="nigeria">Nigeria</option>
                            <option value="ghana">Ghana</option>
                            <option value="kenya">Kenya</option>
                            <option value="cameroon">Cameroon</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Create Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-register">Complete Registration</button>
            </form>

            <p class="footer-note">
                By signing up, you agree to the <a href="terms.html">Terms of Service</a>
            </p>
        </div>
    </div>
    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
    e.preventDefault(); 
    
    const username = document.getElementById('usernameInput').value;

    
    localStorage.setItem('voza_username', username);

    const btn = document.querySelector('.btn-register');
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
    
    setTimeout(() => {
        window.location.href = 'dashboard.html';
    }, 1000);
});
    </script>
</body>
</html>
